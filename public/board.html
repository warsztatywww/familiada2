<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Familiada — tablica</title>
<link rel="stylesheet" href="/board.css">
</head>
<body>
<main id="board">
  <!-- widok idle/intro -->
  <section id="view-intro">
    <video id="intro-video" src="/assets/video/czolowka.mp4" preload="auto" muted playsinline></video>
  </section>

  <!-- widok rundy -->
  <section id="view-round" hidden>
    <div class="side" id="side-0">
      <div class="bank" id="bank-0">0</div>
      <div class="team" id="team-0"></div>
      <div class="strikes" id="strikes-0"></div>
      <div class="buzzed-marker" id="buzzed-0">●</div>
    </div>
    <div class="panel">
      <ol id="answers"></ol>
      <div class="sum-row"><span>SUMA</span><span id="sum">0</span></div>
    </div>
    <div class="side" id="side-1">
      <div class="bank" id="bank-1">0</div>
      <div class="team" id="team-1"></div>
      <div class="strikes" id="strikes-1"></div>
      <div class="buzzed-marker" id="buzzed-1">●</div>
    </div>
  </section>

  <!-- widok finału -->
  <section id="view-final" hidden>
    <div class="final-panel">
      <div id="final-rows"></div>
      <div class="final-bottom">
        <div class="sum-row"><span>SUMA</span><span id="final-sum">0</span></div>
        <div id="final-timer" hidden>15</div>
      </div>
    </div>
  </section>

  <!-- widok końca gry -->
  <section id="view-gameover" hidden>
    <div class="gameover-panel">
      <div class="go-team" id="go-team-0"><span class="name"></span><span class="score"></span></div>
      <div class="go-team" id="go-team-1"><span class="name"></span><span class="score"></span></div>
      <div class="go-final" id="go-final" hidden>FINAŁ: <span id="go-final-sum"></span></div>
    </div>
  </section>

  <!-- overlay wielkiego X -->
  <div id="big-x" hidden>X</div>
</main>
<div id="start-gate">
  <button id="btn-start">⛶ Pełny ekran</button>
  <p>Kliknij, aby rozpocząć i włączyć dźwięk</p>
</div>
<!-- SFX: krótkie efekty, mogą się nakładać na siebie i na jingiel -->
<audio id="snd-good" src="/assets/sounds/dobra-odpowiedz-familiada.mp3" preload="auto"></audio>
<audio id="snd-bad" src="/assets/sounds/bledna-familiada.mp3" preload="auto"></audio>
<audio id="snd-buzz" src="/assets/sounds/dzwonki-familiada.mp3" preload="auto"></audio>
<audio id="snd-final-repeat" src="/assets/sounds/powtorzenie-w-finale-familiada.mp3" preload="auto"></audio>
<audio id="snd-final-time" src="/assets/sounds/czas-final-familiada.mp3" preload="auto"></audio>
<!-- Jingle: długie stingi, tylko jeden gra na raz -->
<audio id="jingle-break" src="/assets/sounds/przerywnik-przed-i-po-familiada.mp3" preload="auto"></audio>
<audio id="jingle-prefinal" src="/assets/sounds/przed-finalem-familiada.mp3" preload="auto"></audio>
<audio id="jingle-after1" src="/assets/sounds/po-1-rundzie-finalu-familiada.mp3" preload="auto"></audio>
<audio id="snd-intro" src="/assets/audio/intro.webm" preload="auto"></audio>
<script type="module" src="/board.js"></script>
</body>
</html>
