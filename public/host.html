<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Familiada — reżyserka</title>
<link rel="stylesheet" href="/host.css">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <strong>Familiada</strong>
    <span>reżyserka</span>
  </div>
  <div id="led-status" class="led">
    <span id="stage-badge">—</span>
    <span id="round-info"></span>
  </div>
  <div class="spacer"></div>
  <div class="cluster">
    <label id="volume-ctl" title="Głośność tablicy">🔊<input id="volume-slider" type="range" min="0" max="100" step="5" value="100"></label>
    <button id="btn-intro">▶ Intro</button>
    <button id="btn-stop-music">■ Stop muzykę</button>
    <button id="btn-fix" aria-expanded="false">⚙</button>
  </div>
  <div id="fix-card" hidden>
    <span class="eyebrow">Korekty (banki, nazwy drużyn)</span>
    <div class="row" data-team="0">
      <label>Nazwa <input class="name-input" maxlength="20"></label>
      <label>Bank <input class="bank-input" type="number" min="0"></label>
      <button class="btn-apply">Zapisz</button>
    </div>
    <div class="row" data-team="1">
      <label>Nazwa <input class="name-input" maxlength="20"></label>
      <label>Bank <input class="bank-input" type="number" min="0"></label>
      <button class="btn-apply">Zapisz</button>
    </div>
  </div>
</header>

<main>
  <section class="card" id="question-card">
    <span class="eyebrow">Pytanie</span>
    <h2 id="question-text">—</h2>
    <ol id="host-answers"></ol>
    <div id="sum-row">
      <span class="eyebrow">Suma rundy</span>
      <span id="host-sum" class="led led-num">0</span>
      <span class="mult">×<span id="host-mult">1</span></span>
    </div>
  </section>

  <section class="card" id="teams-card">
    <div class="team-box" data-team="0">
      <h3 class="team-name"></h3>
      <div class="bank">
        <span class="eyebrow">Bank</span>
        <strong class="bank-value led led-num"></strong>
      </div>
      <div class="strikes-view"></div>
      <button class="btn-play">GRA TA DRUŻYNA</button>
      <button class="btn-strike">+ X</button>
      <button class="btn-award">SUMA DLA NICH</button>
    </div>
    <div class="team-box" data-team="1">
      <h3 class="team-name"></h3>
      <div class="bank">
        <span class="eyebrow">Bank</span>
        <strong class="bank-value led led-num"></strong>
      </div>
      <div class="strikes-view"></div>
      <button class="btn-play">GRA TA DRUŻYNA</button>
      <button class="btn-strike">+ X</button>
      <button class="btn-award">SUMA DLA NICH</button>
    </div>
    <div id="buzzer-status"></div>
    <div class="row">
      <button id="btn-reset-buzzers">Uzbrój buzzery ponownie</button>
      <button id="btn-steal-fail">PRZEJĘCIE: PUDŁO</button>
    </div>
  </section>

  <section class="card" id="final-card" hidden>
    <span class="eyebrow">Finał</span>
    <div class="row">
      <button id="btn-timer-15">Start 15 s (gracz 1)</button>
      <button id="btn-timer-20">Start 20 s (gracz 2)</button>
      <button id="btn-timer-stop">Stop timera</button>
      <button id="btn-repeat" class="danger">POWTÓRZONA!</button>
      <button id="btn-final-cover">ZAKRYJ TABLICĘ</button>
      <span>SUMA FINAŁU: <strong id="final-sum-host">0</strong>/200</span>
    </div>
    <div id="final-questions"></div>
  </section>

</main>

<footer id="bottombar">
  <div class="cluster">
    <button id="btn-undo">⟲ COFNIJ</button>
    <button id="btn-redo">⟳ PONÓW</button>
  </div>
  <div class="cluster">
    <button id="btn-prev-round">◀ Poprzednia</button>
    <button id="btn-reset-round">Resetuj rundę</button>
    <button id="btn-next-round">Następna ▶</button>
  </div>
  <div class="spacer"></div>
  <div class="cluster">
    <button id="btn-final">Finał</button>
    <select id="set-select" title="Zestaw pytań na nową grę"></select>
    <button id="btn-new-game" class="danger">Nowa gra</button>
  </div>
</footer>
<script type="module" src="/host.js"></script>
</body>
</html>
