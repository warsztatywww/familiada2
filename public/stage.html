<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Familiada — scena</title>
<style>
  /* styl reżyserki (host.css): studyjne tło, font Familiada w akcentach,
     kolory drużyn jak ramy tablicy — lewa (0) czerwona, prawa (1) niebieska */
  @font-face { font-family: 'Familiada'; src: url('/assets/fonts/square-down.ttf'); }
  :root {
    --bg: #0b0d13; --panel: #151a24; --line: #29303e;
    --text: #e9ecf2; --muted: #8b93a4;
    --amber: #ffd23f; --amber-glow: rgba(255, 210, 63, 0.4);
    --team0: #c2322a; --team1: #2a52d0;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    color: var(--text);
    font-family: system-ui, sans-serif;
    display: grid; grid-template-rows: auto 1fr auto auto;
    user-select: none; -webkit-user-select: none;
    background:
      radial-gradient(70vw 30vh at 0% 0%, rgba(194, 50, 42, 0.12), transparent 60%),
      radial-gradient(70vw 30vh at 100% 0%, rgba(42, 82, 208, 0.14), transparent 60%),
      var(--bg);
  }
  body.disconnected::before {
    content: 'ŁĄCZĘ…'; position: fixed; top: 12px; left: 0; right: 0;
    font-size: 16px; color: var(--amber); text-align: center;
  }
  .brand { padding: 14px 0 0; text-align: center; line-height: 1.2; }
  .brand strong {
    display: block; font-family: 'Familiada', monospace; font-weight: 400;
    color: var(--amber); text-shadow: 0 0 8px var(--amber-glow);
    font-size: 17px; letter-spacing: 0.08em;
  }
  .brand span {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.35em;
    color: var(--muted);
  }
  main { display: grid; align-content: safe center; justify-content: center; padding: 6vw; gap: 6vw; overflow-y: auto; }
  #question { font-size: 8vw; font-weight: 800; line-height: 1.25; text-align: center; }
  #question.muted { color: var(--muted); font-weight: 400; }
  ol { display: grid; gap: 4vw; padding-left: 8vw; font-size: 5.5vw; font-weight: 600; line-height: 1.3; }
  [hidden] { display: none !important; }
  #status {
    padding: 4vw; font-size: 5vw; font-weight: 700; text-align: center;
    background: var(--panel); border-top: 1px solid var(--line); min-height: 1em;
  }
  #status.team-0 { background: var(--team0); color: #fff; }
  #status.team-1 { background: var(--team1); color: #fff; }
  #huddle {
    padding: 3vw; font-size: 4.5vw; font-weight: 800; text-align: center;
    background: var(--amber); color: var(--bg);
  }
  @media (prefers-reduced-motion: no-preference) {
    #huddle { animation: huddle-pulse 1s ease-in-out infinite; }
    @keyframes huddle-pulse { 50% { background: #ffe38a; } }
  }
</style>
</head>
<body>
<div class="brand">
  <strong>Familiada</strong>
  <span>scena</span>
</div>
<main>
  <div id="question" class="muted">Czekamy na rozpoczęcie…</div>
  <ol id="final" hidden></ol>
</main>
<div id="huddle" hidden></div>
<div id="status"></div>
<script type="module">
  import { connectGame } from '/common/ws.js';
  const questionEl = document.getElementById('question');
  const finalEl = document.getElementById('final');
  const statusEl = document.getElementById('status');
  const huddleEl = document.getElementById('huddle');

  function setQuestion(text, muted) {
    questionEl.textContent = text;
    questionEl.classList.toggle('muted', muted);
    questionEl.hidden = !text;
  }

  function setStatus(text, team = null) {
    statusEl.textContent = text;
    statusEl.className = team === null ? '' : `team-${team}`;
  }

  connectGame(({ state }) => {
    const { round, teams } = state;
    finalEl.hidden = state.phase !== 'final';
    // Po 2. dużym X drużyna przeciwna zaczyna naradę przed ewentualnym przejęciem
    const huddle = state.phase === 'round' && round.stage === 'play'
      && round.strikes[round.playingTeam] === 2;
    huddleEl.hidden = !huddle;
    if (huddle) huddleEl.textContent = `💬 ${teams[1 - round.playingTeam].name} zaczyna naradę!`;
    if (state.phase === 'round') {
      setQuestion(round.question, false);
      if (round.stage === 'buzzers') {
        if (round.buzzed === null) setStatus('🔔 Buzzery — czekamy…');
        else setStatus(`🔔 Wbili się: ${teams[round.buzzed].name}`, round.buzzed);
      } else if (round.stage === 'play') {
        setStatus(`Odpowiada: ${teams[round.playingTeam].name}`, round.playingTeam);
      } else if (round.stage === 'steal') {
        const stealing = 1 - round.playingTeam;
        setStatus(`Przejęcie: ${teams[stealing].name}`, stealing);
      } else {
        setStatus('Runda zakończona');
      }
    } else if (state.phase === 'final') {
      setQuestion('', false);
      finalEl.replaceChildren(...state.final.questions.map((q) => {
        const li = document.createElement('li');
        li.textContent = q.question;
        return li;
      }));
      setStatus('FINAŁ');
    } else {
      setQuestion(state.phase === 'gameover' ? 'Koniec gry' : 'Czekamy na rozpoczęcie…', true);
      setStatus('');
    }
  });

  // ekran nie może zgasnąć w trakcie gry
  function keepAwake() { navigator.wakeLock?.request('screen').catch(() => {}); }
  keepAwake();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
</script>
</body>
</html>
